modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
## displayName 与 description 直接写在这里，不走 gradle.properties
## （.properties 按 ISO-8859-1 解析，中文放进去容易坏）
displayName="矿脉重生 (VeinRebirth)"
authors="${mod_authors}"
logoFile="logo.png"
description='''
可自由配置矿物生成的模组，思路参照 Minecraft 1.12.2 自定义世界里的矿物设置。
'''

## 依赖关系
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
